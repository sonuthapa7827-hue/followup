<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HHV Follow-Up Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f0f2f5;padding-bottom:40px}
.hid{display:none!important}
.box{max-width:420px;margin:30px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.logo{width:70px;height:70px;background:#e31837;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:bold;margin:0 auto 12px;font-size:18px}
h1{font-size:19px;text-align:center}
.sub{text-align:center;color:#777;font-size:13px;margin:4px 0 14px}
label{font-size:13px;font-weight:bold;display:block;margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{padding:12px;background:#e31837;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
.wide{width:100%;margin-top:14px}
.top{background:#151a2e;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top b{font-size:14px}
.top span{color:#fbbf24;font-size:12px}
.sp{flex:1}
.stats{display:flex;gap:8px;padding:12px;max-width:460px;margin:auto}
.st{flex:1;background:#fff;border-radius:10px;padding:8px;text-align:center}
.st b{font-size:20px;display:block}
.st i{font-style:normal;font-size:10.5px;color:#777}
.card{max-width:460px;margin:8px auto;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.badge{font-size:10px;font-weight:bold;padding:3px 8px;border-radius:10px;float:right}
.ov{background:#e31837;color:#fff}
.td{background:#2563eb;color:#fff}
.dn{background:#d1fae5;color:#065f46}
.nm{font-weight:bold;font-size:15px;overflow:hidden}
.meta{font-size:12.5px;color:#555;margin-top:4px;line-height:1.7}
.btns{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.btns a,.btns button{padding:7px 12px;font-size:12.5px;border-radius:7px;text-decoration:none;width:auto;margin:0}
.btns a{background:#eef;color:#333}
.g{background:#059669}
#alert{position:fixed;bottom:12px;left:12px;right:12px;max-width:440px;margin:auto;background:#151a2e;color:#fff;padding:14px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#alert button{margin-top:8px;margin-right:6px}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#151a2e;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:100}
</style>
</head>
<body>

<div id="login" class="box">
  <div class="logo">HHV</div>
  <h1>Hero Homeverse Team</h1>
  <p class="sub">Follow-Up Manager — Free</p>
  <label>👤 Apna Naam</label>
  <input id="uname" placeholder="Rahul Sharma">
  <button class="wide" onclick="login()">🚀 Start Karein</button>
</div>

<div id="app" class="hid">
  <div class="top"><b id="who"></b><span id="uid"></span><span class="sp"></span><button style="width:auto;padding:7px 10px;font-size:12px" onclick="notifTest()">🔔 Sound Test</button></div>
  <div class="stats">
    <div class="st"><b id="t1">0</b><i>Total</i></div>
    <div class="st"><b id="t2">0</b><i>Aaj</i></div>
    <div class="st"><b id="t3">0</b><i>Overdue</i></div>
    <div class="st"><b id="t4">0</b><i>Done</i></div>
  </div>
  <div class="card">
    <label style="margin-top:0">➕ Naya Follow-Up</label>
    <input id="cx" placeholder="CX ka naam">
    <input id="ph" placeholder="Phone number" style="margin-top:6px">
    <input id="pt" placeholder="Partner ka naam (optional)" style="margin-top:6px">
    <div style="display:flex;gap:6px;margin-top:6px">
      <input id="dt" type="date"><input id="tm" type="time">
    </div>
    <button class="wide" onclick="add()">💾 Save</button>
  </div>
  <div id="list"></div>
</div>

<div id="alert" class="hid">
  <b>🔔🔔 FOLLOW-UP TIME!</b>
  <div id="atext" style="margin-top:4px;font-size:14px"></div>
  <button style="background:#444" onclick="snooze()">Snooze 10 min</button>
  <button style="background:#059669" onclick="closeA()">OK ✅</button>
</div>

<div id="toast" class="hid"></div>

<script>
var DB={},CUR=null;
try{DB=JSON.parse(localStorage.getItem('hhv')||'{}')}catch(e){DB={}}
CUR=localStorage.getItem('hhvcur');

function save(){localStorage.setItem('hhv',JSON.stringify(DB));if(CUR)localStorage.setItem('hhvcur',CUR)}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.remove('hid');setTimeout(function(){t.classList.add('hid')},2500)}

/* ============ SOUND SYSTEM (LOUD + VIBRATION) ============ */
var AC=null,alarmInt=null;

/* Pehle tap par hi sound unlock ho jata hai */
function unlockAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
document.addEventListener('click',unlockAudio);
document.addEventListener('touchstart',unlockAudio);

function beep(){
  unlockAudio();
  if(!AC)return;
  try{
    var t=AC.currentTime;
    for(var i=0;i<6;i++){
      var o=AC.createOscillator(),g=AC.createGain();
      o.connect(g);g.connect(AC.destination);
      o.type='square';
      o.frequency.value=(i%2===0)?1000:650;
      var s=t+i*0.4;
      g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.6,s+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,s+0.3);
      o.start(s);o.stop(s+0.35);
    }
  }catch(e){}
}

function vib(){try{navigator.vibrate([400,150,400,150,400])}catch(e){}}

function startAlarm(){
  stopAlarm();
  beep();vib();
  alarmInt=setInterval(function(){beep();vib()},3500);
}
function stopAlarm(){if(alarmInt){clearInterval(alarmInt);alarmInt=null}}

function notifTest(){
  if(!('Notification' in window)){toast('Is browser me notification nahi hai');return}
  if(Notification.permission!=='granted'){
    Notification.requestPermission();
    toast('Pehle Allow dabayein, phir dobara Test dabayein');
    return;
  }
  startAlarm();
  setTimeout(stopAlarm,4500);
  try{new Notification('✅ HHV Team',{body:'Sound + vibration chal raha hai!'})}catch(e){}
  toast('Ye hi awaaz follow-up time par aayegi! 🔊');
}

/* ============ LOGIN ============ */
function login(){
  var n=document.getElementById('uname').value.trim();
  if(n.length<2){toast('Pehle apna naam likhein');return}
  var k=n.toLowerCase();
  if(!DB[k])DB[k]={name:n,id:'HHV-'+Math.floor(1000+Math.random()*9000),list:[]};
  CUR=k;save();
  unlockAudio();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  enter();
}

function enter(){
  if(!DB[CUR].list)DB[CUR].list=[];
  document.getElementById('login').classList.add('hid');
  document.getElementById('app').classList.remove('hid');
  document.getElementById('who').textContent='👤 '+DB[CUR].name;
  document.getElementById('uid').textContent=DB[CUR].id;
  render();
}

/* ============ ADD / LIST ============ */
function pad(n){return n<10?'0'+n:''+n}
function wa(ph){var x=ph.replace(/\D/g,'');if(x.length===10)x='91'+x;return 'https://wa.me/'+x}
function isToday(d){var n=new Date();return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}

function add(){
  var cx=document.getElementById('cx').value.trim();
  var ph=document.getElementById('ph').value.trim();
  var pt=document.getElementById('pt').value.trim();
  var dt=document.getElementById('dt').value;
  var tm=document.getElementById('tm').value;
  if(!cx||!ph||!dt||!tm){toast('CX, Phone, Date, Time sab bharein');return}
  DB[CUR].list.push({cx:cx,ph:ph,pt:pt,dt:dt+'T'+tm,st:'p',nf:0});
  save();
  document.getElementById('cx').value='';
  document.getElementById('ph').value='';
  document.getElementById('pt').value='';
  toast('✅ Save ho gaya');
  render();
}

function render(){
  if(!CUR)return;
  var L=DB[CUR].list,now=new Date();
  var t1=0,t2=0,t3=0,t4=0,html='';
  for(var i=0;i<L.length;i++){
    var f=L[i];t1++;
    var d=new Date(f.dt);
    var over=(f.st==='p'&&d.getTime()<now.getTime());
    if(f.st==='p'&&!over&&isToday(d))t2++;
    if(over)t3++;
    if(f.st==='d')t4++;
    var b='';
    if(f.st==='d')b='<span class="badge dn">DONE ✔</span>';
    else if(over)b='<span class="badge ov">OVERDUE ⏰</span>';
    else if(isToday(d))b='<span class="badge td">AAJ '+pad(d.getHours())+':'+pad(d.getMinutes())+'</span>';
    else b='<span class="badge td" style="background:#888">'+pad(d.getDate())+'/'+pad(d.getMonth()+1)+'</span>';
    html+='<div class="card"><div class="nm">👤 '+f.cx+' '+b+'</div>'+
    '<div class="meta">📞 '+f.ph+(f.pt?'<br>🤝 '+f.pt:'')+'<br>🕐 '+f.dt.replace('T',' ')+'</div>'+
    '<div class="btns">'+
    '<a href="tel:'+f.ph+'">📞 Call</a>'+
    '<a target="_blank" href="'+wa(f.ph)+'">💬 WhatsApp</a>'+
    (f.st==='d'?'<button style="background:#888" onclick="ud('+i+')">↩ Undo</button>':'<button class="g" onclick="ud('+i+')">✔ Done</button>')+
    '<button style="background:#888" onclick="dl('+i+')">🗑</button>'+
    '</div></div>';
  }
  document.getElementById('list').innerHTML=html||'<div class="card" style="text-align:center;color:#999;padding:24px">Koi follow-up nahi hai.<br>Upar se add karein ➕</div>';
  document.getElementById('t1').textContent=t1;
  document.getElementById('t2').textContent=t2;
  document.getElementById('t3').textContent=t3;
  document.getElementById('t4').textContent=t4;
}

function ud(i){var f=DB[CUR].list[i];f.st=(f.st==='d')?'p':'d';if(f.st==='p')f.nf=0;save();render()}
function dl(i){DB[CUR].list.splice(i,1);save();render()}

/* ============ ALERT ============ */
function closeA(){stopAlarm();document.getElementById('alert').classList.add('hid')}

function snooze(){
  var f=window._cf;if(!f)return;
  var d=new Date(Date.now()+600000);
  f.dt=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  f.nf=0;save();render();closeA();
  toast('⏰ 10 minute baad phir alarm bajega');
}

function check(){
  if(!CUR||!DB[CUR])return;
  var now=Date.now();
  DB[CUR].list.forEach(function(f){
    if(f.st==='p'&&!f.nf&&new Date(f.dt).getTime()<=now){
      f.nf=1;save();
      window._cf=f;
      document.getElementById('atext').innerHTML='<b>'+f.cx+'</b> • '+f.ph+(f.pt?' • '+f.pt:'')+'<br>🕐 '+f.dt.replace('T',' ');
      document.getElementById('alert').classList.remove('hid');
      startAlarm();
      if('Notification' in window&&Notification.permission==='granted'){
        try{new Notification('🔔 Follow-Up: '+f.cx,{body:'📞 '+f.ph})}catch(e){}
      }
    }
  });
  render();
}
setInterval(check,10000);

if(CUR&&DB[CUR])enter();
</script>
</body>
</html>
